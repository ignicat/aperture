[package]
name = "cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "aperture"
path = "src/bin/main.rs"

[lints]
workspace = true

[dependencies]
engine = { package = "core", path = "../core" }
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "event", "termios", "process", "thread", "time", "param"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
x11rb = { version = "0.14.0", features = ["randr"] }
