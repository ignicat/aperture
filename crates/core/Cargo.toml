[package]
name = "core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []
jxl = ["dep:jxl-oxide"]
avif = ["dep:avif-decode", "dep:ravif"]
svg = ["dep:resvg"]
all-formats = ["jxl", "avif", "svg"]

[dependencies]
fast_image_resize = "6.1.0"
moxcms = "0.9.2"
rustfft = "6.4.1"
rustdct = "0.7.1"
img-parts = "0.4.2"
png = "0.18.1"
zune-jpeg = "0.5.15"
jpeg-encoder = "0.7.1"
image-webp = "0.2.4"
gif = "0.14.2"
tiff = "0.11.3"
qoi = "0.4.1"
ico = "0.6.0"
exr = { version = "1.74.3", default-features = false }
rawzip = "0.5.2"
flate2 = "1.1.11"
tar = { version = "0.4.46", default-features = false }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
lzma-rs = { version = "0.3.0", features = ["stream"] }
bzip2-rs = "0.1.2"
jxl-oxide = { version = "0.12.6", default-features = false, features = ["moxcms"], optional = true }
avif-decode = { version = "3.0.0", default-features = false, optional = true }
ravif = { version = "0.13.0", default-features = false, optional = true }
resvg = { version = "0.50.0", default-features = false, optional = true }
